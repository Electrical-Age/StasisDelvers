license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Baughn (design), tsugumi-lab"
description='''
Time stands still outside fields kept running by Electrical Age power.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# optional: the stopped-land overlay on Xaero's Minimap / World Map (applies only when they're installed)
[[mixins]]
config="${mod_id}.xaero.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="eln"
    type="required"
    versionRange="[26.3-0.1.0-port,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
