plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    // Xaero's Minimap / World Map, compile-only for the optional stopped-land map overlay (compat/xaero)
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Runs every registered game test headless, then exits (exit code = failed required tests).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'stasisdelvers.noSpawnArea', 'true'
            // only this mod's tests (Electrical Age's own tests are registered too, and can't run in stopped time)
            programArguments.addAll '--tests', project.mod_id + ':*'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit and property tests (src/test, JUnit 5 + jqwik) run with the game on the classpath and the mod loaded
    // (codecs, BlockPos). The GameTests are not part of `test`: they run only in runGameTestServer.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Electrical Age 26.x (github Electrical-Age/ElectricalAge, branch ports/26.3): built locally. Compiled against,
// and copied into run/mods so the dev runs load it as a real mod jar (with its jarJar'd Kotlin and commons-math).
def elnJar = file(project.findProperty('eln_jar') ?: '/var/lib/mclab/agent/eln/port26/build/libs/eln-26.3-0.1.0-port.jar')
dependencies {
    compileOnly files(elnJar)
    compileOnly 'maven.modrinth:xaeros-minimap:j2Xo3Dhc'   // xaerominimap-neoforge-26.3-26.6.0
    compileOnly 'maven.modrinth:xaeros-world-map:p5t2Xn8F' // xaeroworldmap-neoforge-26.3-1.47.0

    // the mod requires eln, so the unit-test game loads it too
    testImplementation files(elnJar)
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.jqwik:jqwik:1.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // (the unit-test game runs in its own directory: an absolute path keeps jqwik's failure database in build/)
    systemProperty 'jqwik.database', layout.buildDirectory.file('jqwik-database').get().asFile.absolutePath
    testLogging { events 'failed'; exceptionFormat 'full' }
}
def copyEln = tasks.register('copyElnToRun', Copy) {
    from elnJar
    into file('run/mods')
}
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn copyEln }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

// The tower generator (pure Java, :towergen) is compiled into the mod; the mod ships its compact TGLB1 library
// (/towergen/p3a_library.bin.gz), not the JSON one.
sourceSets.main.java.srcDir 'towergen/src/main/java'
def towerLibRes = tasks.register('towerLibraryResource', Copy) {
    dependsOn ':towergen:libraryBin'
    from project(':towergen').layout.buildDirectory.file('libbin/p3a_library.bin.gz')
    into layout.buildDirectory.dir('generated/towerlib/towergen')
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('generated/towerlib')).builtBy(towerLibRes))
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The deep mist's reduced-resolution pass (post_effect/stasis.json) is stasis.fsh compiled with MIST_PASS defined
tasks.named('processResources', ProcessResources) {
    from('src/main/resources/assets/stasisdelvers/shaders/post/stasis.fsh') {
        into 'assets/stasisdelvers/shaders/post'
        rename { 'stasis_mist.fsh' }
        filter { String line -> line.startsWith('#version') ? line + '\n#define MIST_PASS' : line }
    }
    from('src/main/resources/assets/stasisdelvers/shaders/post/stasis.fsh') {
        into 'assets/stasisdelvers/shaders/post'
        rename { 'stasis_strata.fsh' }
        filter { String line -> line.startsWith('#version') ? line + '\n#define STRATA_PASS' : line }
    }
}
