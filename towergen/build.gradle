plugins {
    id 'java-library'
}

group = 'org.erisia.stasis'
version = '0.1.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        // slow tests (timings, random layouts): ./gradlew :towergen:slowTest
        excludeTags 'slow'
    }
    maxHeapSize = '2g'
    testLogging { events 'failed'; exceptionFormat 'full'; showStandardStreams = true }
}

tasks.register('slowTest', Test) {
    description = 'Timing and random-layout tests'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'slow' }
    maxHeapSize = '2g'
    systemProperty 'towergen.random', System.getProperty('towergen.random', '60')
    systemProperty 'towergen.seed', System.getProperty('towergen.seed', '20261012')
    testLogging { events 'failed', 'passed'; exceptionFormat 'full'; showStandardStreams = true }
}

// compact binary library for the browser build (towerweb): build/libbin/p3a_library.bin.gz
tasks.register('libraryBin', JavaExec) {
    description = 'Writes the TGLB1 binary library (LibraryBin)'
    group = 'build'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.erisia.stasis.towergen.LibraryBin'
    def out = layout.buildDirectory.file('libbin/p3a_library.bin.gz')
    inputs.files(sourceSets.main.runtimeClasspath)
    outputs.file(out)
    args out.get().asFile.absolutePath
    maxHeapSize = '2g'
}
